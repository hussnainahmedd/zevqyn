<style data-wp-block-html="css">
.hero-section,
.entry-header {
    display: none !important;
}




#zev-admin-inbox {
    --zai-bg: #020807;
    --zai-panel: rgba(8, 19, 16, 0.88);
    --zai-panel-2: rgba(12, 27, 22, 0.82);
    --zai-border: rgba(92, 255, 150, 0.13);
    --zai-border-strong: rgba(92, 255, 150, 0.27);
    --zai-green: #42d66d;
    --zai-green-soft: rgba(66, 214, 109, 0.12);
    --zai-text: #f3f7f5;
    --zai-muted: #8c9c96;
    --zai-danger: #ff7373;

    min-height: 100vh;
    background:
        radial-gradient(
            circle at 70% 10%,
            rgba(25, 140, 75, 0.11),
            transparent 34%
        ),
        #020807;

    color: var(--zai-text);
    padding: 60px 22px 90px;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


#zev-admin-inbox * {
    box-sizing: border-box;
}


#zev-admin-inbox button,
#zev-admin-inbox input,
#zev-admin-inbox select {
    font: inherit;
}


.zai-shell {
    width: min(1320px, 100%);
    margin: 0 auto;
}


/* =====================================
   TOP BAR
   ===================================== */

.zai-topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 30px;
    margin-bottom: 34px;
}


.zai-eyebrow {
    color: var(--zai-green);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    margin-bottom: 10px;
}


.zai-topbar h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.04em;
}


.zai-topbar p {
    margin: 12px 0 0;
    color: var(--zai-muted);
    font-size: 15px;
}


.zai-admin-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px;
    border: 1px solid var(--zai-border);
    background: rgba(12, 25, 21, 0.8);
    border-radius: 999px;
    color: #cce7d5;
    font-size: 13px;
    font-weight: 700;
}


.zai-admin-dot {
    width: 8px;
    height: 8px;
    background: var(--zai-green);
    border-radius: 50%;
    box-shadow:
        0 0 14px rgba(66, 214, 109, 0.8);
}


/* =====================================
   STATS
   ===================================== */

.zai-stats {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
}


.zai-stat-card {
    border: 1px solid var(--zai-border);
    background: var(--zai-panel);
    border-radius: 16px;
    padding: 20px;
}


.zai-stat-card span {
    display: block;
    color: var(--zai-muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
}


.zai-stat-card strong {
    display: block;
    font-size: 30px;
    line-height: 1;
}


/* =====================================
   TOOLBAR
   ===================================== */

.zai-toolbar {
    display: grid;
    grid-template-columns:
        minmax(200px, 1fr)
        180px
        auto;
    gap: 12px;
    margin-bottom: 18px;
}


.zai-search-wrap {
    position: relative;
}


.zai-search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--zai-muted);
    pointer-events: none;
}


.zai-search-wrap input,
.zai-toolbar select {
    width: 100%;
    height: 46px;
    border: 1px solid var(--zai-border);
    background: rgba(7, 18, 15, 0.92);
    color: var(--zai-text);
    border-radius: 12px;
    outline: none;
}


.zai-search-wrap input {
    padding: 0 15px 0 42px;
}


.zai-toolbar select {
    padding: 0 14px;
    color-scheme: dark;
}


.zai-search-wrap input:focus,
.zai-toolbar select:focus {
    border-color: var(--zai-border-strong);
}


.zai-refresh {
    height: 46px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--zai-border);
    background: var(--zai-panel);
    color: #dce8e1;
    cursor: pointer;
    transition: 0.2s ease;
}


.zai-refresh:hover {
    border-color: var(--zai-green);
    color: white;
}


/* =====================================
   STATUS
   ===================================== */

.zai-status {
    display: none;
    padding: 13px 16px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 13px;
}


.zai-status.zai-show {
    display: block;
}


.zai-status.zai-info {
    border: 1px solid rgba(90, 160, 255, 0.22);
    background: rgba(90, 160, 255, 0.08);
    color: #bcd8ff;
}


.zai-status.zai-error {
    border: 1px solid rgba(255, 115, 115, 0.25);
    background: rgba(255, 115, 115, 0.08);
    color: #ffaaaa;
}


/* =====================================
   INBOX
   ===================================== */

.zai-inbox {
    min-height: 590px;
    display: grid;
    grid-template-columns:
        minmax(310px, 0.78fr)
        minmax(0, 1.5fr);
    overflow: hidden;
    border: 1px solid var(--zai-border);
    border-radius: 20px;
    background: var(--zai-panel);
    box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.28);
}


.zai-list-panel {
    min-width: 0;
    border-right: 1px solid var(--zai-border);
}


.zai-list-heading {
    height: 58px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--zai-border);
    font-size: 13px;
    font-weight: 800;
}


.zai-small-count {
    min-width: 28px;
    height: 24px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--zai-green-soft);
    color: var(--zai-green);
}


.zai-message-list {
    max-height: 650px;
    overflow-y: auto;
}


.zai-message-item {
    position: relative;
    padding: 17px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    cursor: pointer;
    transition: 0.18s ease;
}


.zai-message-item:hover {
    background: rgba(255, 255, 255, 0.025);
}


.zai-message-item.zai-active {
    background: var(--zai-green-soft);
}


.zai-message-item.zai-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    background: var(--zai-green);
    border-radius: 0 4px 4px 0;
}


.zai-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 7px;
}


.zai-sender {
    font-size: 14px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


.zai-date {
    color: var(--zai-muted);
    font-size: 10px;
    white-space: nowrap;
}


.zai-item-subject {
    color: #c8d5d0;
    font-size: 12px;
    margin-bottom: 7px;
}


.zai-item-preview {
    color: var(--zai-muted);
    font-size: 12px;
    line-height: 1.55;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}


.zai-status-pill {
    display: inline-flex;
    margin-top: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 800;
}


.zai-pill-new {
    color: #7ef39c;
    background: rgba(66, 214, 109, 0.12);
}


.zai-pill-read {
    color: #91c8ff;
    background: rgba(80, 160, 255, 0.11);
}


.zai-pill-replied {
    color: #c7a6ff;
    background: rgba(154, 100, 255, 0.11);
}


.zai-pill-archived {
    color: #a4ada9;
    background: rgba(150, 160, 155, 0.1);
}


/* =====================================
   DETAIL
   ===================================== */

.zai-detail {
    min-width: 0;
    padding: 34px;
}


.zai-empty {
    min-height: 510px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}


.zai-empty-icon {
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--zai-border);
    background: var(--zai-green-soft);
    color: var(--zai-green);
    border-radius: 18px;
    font-size: 26px;
    margin-bottom: 18px;
}


.zai-empty h2 {
    margin: 0 0 8px;
    font-size: 21px;
}


.zai-empty p {
    max-width: 330px;
    margin: 0;
    color: var(--zai-muted);
    line-height: 1.65;
    font-size: 13px;
}


.zai-detail-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}


.zai-detail-label {
    color: var(--zai-green);
    font-size: 10px;
    letter-spacing: 0.12em;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 8px;
}


.zai-detail h2 {
    margin: 0;
    font-size: 28px;
    line-height: 1.2;
}


.zai-detail-date {
    color: var(--zai-muted);
    font-size: 11px;
    white-space: nowrap;
}


.zai-person {
    display: grid;
    grid-template-columns:
        1fr
        1fr;
    gap: 12px;
    margin-bottom: 24px;
}


.zai-person-box {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--zai-border);
    background: rgba(255, 255, 255, 0.018);
}


.zai-person-box span {
    display: block;
    color: var(--zai-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
}


.zai-person-box strong,
.zai-person-box a {
    color: #edf5f0;
    font-size: 13px;
    text-decoration: none;
    word-break: break-word;
}


.zai-person-box a:hover {
    color: var(--zai-green);
}


.zai-message-body {
    padding: 22px;
    border-radius: 15px;
    border: 1px solid var(--zai-border);
    background: rgba(0, 0, 0, 0.18);
    color: #d5e0da;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-bottom: 25px;
}


.zai-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}


.zai-actions select {
    height: 42px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--zai-border);
    background: #07120f;
    color: white;
    color-scheme: dark;
    outline: none;
}


.zai-action-button {
    height: 42px;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--zai-border);
    background: rgba(255, 255, 255, 0.025);
    color: #e7eee9;
    cursor: pointer;
}


.zai-action-button:hover {
    border-color: var(--zai-green);
}


.zai-reply {
    background: var(--zai-green);
    border-color: var(--zai-green);
    color: #031108;
    font-weight: 800;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}


.zai-reply:hover {
    color: #031108;
    transform: translateY(-1px);
}


/* =====================================
   LOADING
   ===================================== */

.zai-loading {
    padding: 30px 18px;
    color: var(--zai-muted);
    font-size: 13px;
}


.zai-no-results {
    padding: 40px 20px;
    text-align: center;
    color: var(--zai-muted);
    font-size: 13px;
}


/* =====================================
   RESPONSIVE
   ===================================== */

@media (max-width: 900px) {

    #zev-admin-inbox {
        padding:
            40px 14px
            70px;
    }

    .zai-stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .zai-toolbar {
        grid-template-columns:
            1fr 1fr;
    }

    .zai-search-wrap {
        grid-column:
            1 / -1;
    }

    .zai-inbox {
        grid-template-columns: 1fr;
    }

    .zai-list-panel {
        border-right: 0;
        border-bottom:
            1px solid var(--zai-border);
    }

    .zai-message-list {
        max-height: 430px;
    }

}


@media (max-width: 560px) {

    .zai-topbar {
        flex-direction: column;
    }

    .zai-stats {
        grid-template-columns:
            1fr 1fr;
    }

    .zai-toolbar {
        grid-template-columns: 1fr;
    }

    .zai-search-wrap {
        grid-column: auto;
    }

    .zai-detail {
        padding: 22px 16px;
    }

    .zai-detail-top {
        flex-direction: column;
    }

    .zai-person {
        grid-template-columns: 1fr;
    }

}

<script data-wp-block-html="js">
function zevAdminInboxInitialize() {

    var API_BASE =
        "https://zevqyn-backend.onrender.com";

    var SUPABASE_URL =
        "https://phjizxajnigiiawitkyx.supabase.co";

    var SUPABASE_KEY =
        "sb_publishable_oYTMqlTbVsNqToWxvq6I9w_pQ9NFZWk";


    var root =
        document.getElementById(
            "zev-admin-inbox"
        );

    if (!root) {
        return;
    }


    var messageList =
        document.getElementById(
            "zai-message-list"
        );

    var detail =
        document.getElementById(
            "zai-detail"
        );

    var searchField =
        document.getElementById(
            "zai-search"
        );

    var filterField =
        document.getElementById(
            "zai-filter"
        );

    var refreshButton =
        document.getElementById(
            "zai-refresh"
        );

    var statusBox =
        document.getElementById(
            "zai-status"
        );


    var messages = [];

    var selectedId = null;

    var accessToken = null;


    /* =====================================
       HELPERS
       ===================================== */

    function zaiEscape(value) {

        var element =
            document.createElement("div");

        element.textContent =
            value === null
                ? ""
                : String(value);

        return element.innerHTML;

    }


    function zaiShowStatus(
        message,
        type
    ) {

        if (!statusBox) {
            return;
        }

        statusBox.className =
            "zai-status zai-show " +
            type;

        statusBox.textContent =
            message;

    }


    function zaiHideStatus() {

        if (!statusBox) {
            return;
        }

        statusBox.className =
            "zai-status";

        statusBox.textContent = "";

    }


    function zaiFormatDate(value) {

        if (!value) {
            return "";
        }

        var date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return value;
        }

        return date.toLocaleString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            }
        );

    }


    function zaiGetStatusClass(
        status
    ) {

        if (status === "new") {
            return "zai-pill-new";
        }

        if (status === "read") {
            return "zai-pill-read";
        }

        if (status === "replied") {
            return "zai-pill-replied";
        }

        return "zai-pill-archived";

    }


    /* =====================================
       SUPABASE SESSION
       ===================================== */

  function zaiGetSession() {

    var storageKey =
        "sb-phjizxajnigiiawitkyx-auth-token";

    var storedValue =
        window.localStorage.getItem(
            storageKey
        );

    if (!storedValue) {

        zaiShowStatus(
            "Please sign in to ZEVQYN again.",
            "zai-error"
        );

        return;

    }


    var storedData = null;

    try {

        storedData =
            JSON.parse(
                storedValue
            );

    } catch (error) {

        zaiShowStatus(
            "Your ZEVQYN login session could not be read.",
            "zai-error"
        );

        return;

    }


    var token = null;


    if (storedData) {

        if (storedData.access_token) {

            token =
                storedData.access_token;

        }


        if (!token) {

            if (storedData.currentSession) {

                if (
                    storedData.currentSession.access_token
                ) {

                    token =
                        storedData.currentSession.access_token;

                }

            }

        }


        if (!token) {

            if (storedData.session) {

                if (
                    storedData.session.access_token
                ) {

                    token =
                        storedData.session.access_token;

                }

            }

        }

    }


    if (!token) {

        zaiShowStatus(
            "Your ZEVQYN session token could not be found. Please sign in again.",
            "zai-error"
        );

        return;

    }


    accessToken = token;


    zaiHideStatus();


    zaiLoadMessages();

}


    /* =====================================
       API REQUEST
       ===================================== */

    function zaiApiRequest(
        method,
        path,
        body,
        callback
    ) {

        if (!accessToken) {

            zaiShowStatus(
                "Your ZEVQYN session is unavailable.",
                "zai-error"
            );

            return;

        }


        var request =
            new XMLHttpRequest();


        request.open(
            method,
            API_BASE + path,
            true
        );


        request.setRequestHeader(
            "Authorization",
            "Bearer " + accessToken
        );


        request.setRequestHeader(
            "Content-Type",
            "application/json"
        );


        request.onreadystatechange =
            function () {

                if (
                    request.readyState !== 4
                ) {
                    return;
                }


                var data = null;


                try {

                    data =
                        JSON.parse(
                            request.responseText
                        );

                } catch (error) {

                    data = null;

                }


                callback(
                    request.status,
                    data
                );

            };


        request.onerror =
            function () {

                callback(
                    0,
                    null
                );

            };


        if (body) {

            request.send(
                JSON.stringify(body)
            );

        } else {

            request.send();

        }

    }


    /* =====================================
       LOAD MESSAGES
       ===================================== */

    function zaiLoadMessages() {

        if (messageList) {

            messageList.innerHTML =
                '<div class="zai-loading">' +
                'Loading messages...' +
                '</div>';

        }


        zaiHideStatus();


        zaiApiRequest(
            "GET",
            "/api/v1/contact/messages",
            null,
            function (
                status,
                data
            ) {

                if (status === 401) {

                    zaiShowStatus(
                        "Your session has expired. Please sign in again.",
                        "zai-error"
                    );

                    return;

                }


                if (status === 403) {

                    zaiShowStatus(
                        "Admin access is required to view this inbox.",
                        "zai-error"
                    );

                    if (messageList) {
                        messageList.innerHTML = "";
                    }

                    return;

                }


                if (status !== 200) {

                    zaiShowStatus(
                        "Unable to load contact messages.",
                        "zai-error"
                    );

                    return;

                }


                if (
                    !Array.isArray(data)
                ) {

                    zaiShowStatus(
                        "Unexpected response from the server.",
                        "zai-error"
                    );

                    return;

                }


                messages = data;


                zaiUpdateStats();

                zaiRenderList();


                if (
                    selectedId
                ) {

                    zaiRenderSelected();

                }

            }
        );

    }


    /* =====================================
       STATS
       ===================================== */

    function zaiUpdateStats() {

        var total =
            messages.length;

        var newCount = 0;

        var readCount = 0;

        var repliedCount = 0;


        messages.forEach(
            function (message) {

                if (
                    message.status ===
                    "new"
                ) {
                    newCount += 1;
                }

                if (
                    message.status ===
                    "read"
                ) {
                    readCount += 1;
                }

                if (
                    message.status ===
                    "replied"
                ) {
                    repliedCount += 1;
                }

            }
        );


        document.getElementById(
            "zai-total-count"
        ).textContent =
            String(total);


        document.getElementById(
            "zai-new-count"
        ).textContent =
            String(newCount);


        document.getElementById(
            "zai-read-count"
        ).textContent =
            String(readCount);


        document.getElementById(
            "zai-replied-count"
        ).textContent =
            String(repliedCount);

    }


    /* =====================================
       FILTER
       ===================================== */

    function zaiFilteredMessages() {

        var query = "";

        var filter = "all";


        if (searchField) {

            query =
                searchField.value
                    .trim()
                    .toLowerCase();

        }


        if (filterField) {

            filter =
                filterField.value;

        }


        return messages.filter(
            function (message) {

                if (
                    filter !== "all"
                ) {

                    if (
                        message.status !==
                        filter
                    ) {
                        return false;
                    }

                }


                if (!query) {
                    return true;
                }


                var combined =
                    String(
                        message.name || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.email || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.subject || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.message || ""
                    ).toLowerCase();


                return (
                    combined.indexOf(
                        query
                    ) !== -1
                );

            }
        );

    }


    /* =====================================
       LIST
       ===================================== */

    function zaiRenderList() {

        if (!messageList) {
            return;
        }


        var filtered =
            zaiFilteredMessages();


        var visibleCount =
            document.getElementById(
                "zai-visible-count"
            );


        if (visibleCount) {

            visibleCount.textContent =
                String(
                    filtered.length
                );

        }


        if (
            filtered.length === 0
        ) {

            messageList.innerHTML =
                '<div class="zai-no-results">' +
                'No messages found.' +
                '</div>';

            return;

        }


        var html = "";


        filtered.forEach(
            function (message) {

                var activeClass = "";

                if (
                    selectedId ===
                    message.id
                ) {

                    activeClass =
                        " zai-active";

                }


                var preview =
                    message.message || "";


                html +=
                    '<div class="zai-message-item' +
                    activeClass +
                    '" data-message-id="' +
                    zaiEscape(
                        message.id
                    ) +
                    '">' +

                    '<div class="zai-item-top">' +

                    '<div class="zai-sender">' +
                    zaiEscape(
                        message.name
                    ) +
                    '</div>' +

                    '<div class="zai-date">' +
                    zaiEscape(
                        zaiFormatDate(
                            message.created_at
                        )
                    ) +
                    '</div>' +

                    '</div>' +

                    '<div class="zai-item-subject">' +
                    zaiEscape(
                        message.subject
                    ) +
                    '</div>' +

                    '<div class="zai-item-preview">' +
                    zaiEscape(
                        preview
                    ) +
                    '</div>' +

                    '<span class="zai-status-pill ' +
                    zaiGetStatusClass(
                        message.status
                    ) +
                    '">' +
                    zaiEscape(
                        message.status
                    ) +
                    '</span>' +

                    '</div>';

            }
        );


        messageList.innerHTML =
            html;


        var items =
            messageList.querySelectorAll(
                ".zai-message-item"
            );


        items.forEach(
            function (item) {

                item.addEventListener(
                    "click",
                    function () {

                        selectedId =
                            item.getAttribute(
                                "data-message-id"
                            );


                        zaiRenderList();

                        zaiRenderSelected();

                    }
                );

            }
        );

    }


    /* =====================================
       DETAIL
       ===================================== */

    function zaiFindSelected() {

        var selected = null;


        messages.forEach(
            function (message) {

                if (
                    message.id ===
                    selectedId
                ) {

                    selected =
                        message;

                }

            }
        );


        return selected;

    }


    function zaiRenderSelected() {

        if (!detail) {
            return;
        }


        var message =
            zaiFindSelected();


        if (!message) {

            detail.innerHTML =
                '<div class="zai-empty">' +
                '<div class="zai-empty-icon">✉</div>' +
                '<h2>Select a message</h2>' +
                '<p>Choose a contact message from the inbox to read it here.</p>' +
                '</div>';

            return;

        }


        var replyLink =
            "mailto:" +
            encodeURIComponent(
                message.email
            ) +
            "?subject=" +
            encodeURIComponent(
                "Re: " +
                message.subject +
                " — ZEVQYN"
            );


        detail.innerHTML =

            '<div class="zai-detail-top">' +

                '<div>' +

                    '<div class="zai-detail-label">' +
                    'Contact message' +
                    '</div>' +

                    '<h2>' +
                    zaiEscape(
                        message.subject
                    ) +
                    '</h2>' +

                '</div>' +

                '<div class="zai-detail-date">' +
                zaiEscape(
                    zaiFormatDate(
                        message.created_at
                    )
                ) +
                '</div>' +

            '</div>' +


            '<div class="zai-person">' +

                '<div class="zai-person-box">' +

                    '<span>From</span>' +

                    '<strong>' +
                    zaiEscape(
                        message.name
                    ) +
                    '</strong>' +

                '</div>' +


                '<div class="zai-person-box">' +

                    '<span>Email</span>' +

                    '<a href="mailto:' +
                    zaiEscape(
                        message.email
                    ) +
                    '">' +
                    zaiEscape(
                        message.email
                    ) +
                    '</a>' +

                '</div>' +

            '</div>' +


            '<div class="zai-message-body">' +
            zaiEscape(
                message.message
            ) +
            '</div>' +


            '<div class="zai-actions">' +

                '<select id="zai-status-select">' +

                    '<option value="new">' +
                    'New' +
                    '</option>' +

                    '<option value="read">' +
                    'Read' +
                    '</option>' +

                    '<option value="replied">' +
                    'Replied' +
                    '</option>' +

                    '<option value="archived">' +
                    'Archived' +
                    '</option>' +

                '</select>' +


                '<button ' +
                'id="zai-save-status" ' +
                'class="zai-action-button" ' +
                'type="button">' +
                'Update status' +
                '</button>' +


                '<a class="zai-action-button zai-reply" href="' +
                zaiEscape(
                    replyLink
                ) +
                '">' +
                'Reply by email' +
                '</a>' +

            '</div>';


        var statusSelect =
            document.getElementById(
                "zai-status-select"
            );


        if (statusSelect) {

            statusSelect.value =
                message.status;

        }


        var saveButton =
            document.getElementById(
                "zai-save-status"
            );


        if (saveButton) {

            saveButton.addEventListener(
                "click",
                function () {

                    zaiUpdateMessageStatus(
                        message.id,
                        statusSelect.value
                    );

                }
            );

        }


        if (
            message.status === "new"
        ) {

            zaiUpdateMessageStatus(
                message.id,
                "read",
                true
            );

        }

    }


    /* =====================================
       UPDATE STATUS
       ===================================== */

    function zaiUpdateMessageStatus(
        id,
        newStatus,
        silent
    ) {

        zaiApiRequest(
            "PATCH",
            "/api/v1/contact/messages/" +
            encodeURIComponent(id),
            {
                status: newStatus
            },
            function (
                status,
                data
            ) {

                if (status !== 200) {

                    if (!silent) {

                        zaiShowStatus(
                            "Unable to update message status.",
                            "zai-error"
                        );

                    }

                    return;

                }


                messages.forEach(
                    function (message) {

                        if (
                            message.id === id
                        ) {

                            message.status =
                                data.status;

                        }

                    }
                );


                zaiUpdateStats();

                zaiRenderList();

                zaiRenderSelected();


                if (!silent) {

                    zaiShowStatus(
                        "Message status updated.",
                        "zai-info"
                    );

                }

            }
        );

    }


    /* =====================================
       SEARCH + FILTER
       ===================================== */

    if (searchField) {

        searchField.addEventListener(
            "input",
            function () {

                zaiRenderList();

            }
        );

    }


    if (filterField) {

        filterField.addEventListener(
            "change",
            function () {

                zaiRenderList();

            }
        );

    }


    if (refreshButton) {

        refreshButton.addEventListener(
            "click",
            function () {

                zaiLoadMessages();

            }
        );

    }


    /* =====================================
       START
       ===================================== */

    zaiGetSession();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            zevAdminInboxInitialize();

        }
    );

} else {

    zevAdminInboxInitialize();

}
</script>

        <header class="zai-topbar">
            <div>
                <div class="zai-eyebrow">ZEVQYN ADMIN</div>
                <h1>Contact Inbox</h1>
                <p>Manage messages sent through the ZEVQYN website.</p>
            </div>

            <div class="zai-admin-badge">
                <span class="zai-admin-dot"></span>
                Admin
            </div>
        </header>


        <!-- STATS -->
        <section class="zai-stats">

            <div class="zai-stat-card">
                <span>Total</span>
                <strong id="zai-total-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>New</span>
                <strong id="zai-new-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>Read</span>
                <strong id="zai-read-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>Replied</span>
                <strong id="zai-replied-count">0</strong>
            </div>

        </section>


        <!-- TOOLBAR -->
        <section class="zai-toolbar">

            <div class="zai-search-wrap">
                <span class="zai-search-icon">⌕</span>

                <input id="zai-search" type="text" placeholder="Search messages..." autocomplete="off">
            </div>


            <select id="zai-filter">
                <option value="all">All messages</option>
                <option value="new">New</option>
                <option value="read">Read</option>

        <div id="zai-status" class="zai-status"></div>

        <section class="zai-inbox">

                </div>


                <div id="zai-message-list" class="zai-message-list">
                </div>

            </aside>


            <!-- MESSAGE DETAIL -->
            <main id="zai-detail" class="zai-detail">

                <div class="zai-empty">

                    <div class="zai-empty-icon">
                        ✉
                    </div>

                    <h2>Select a message</h2>

                    <p>
                        Choose a contact message from the
                        inbox to read it here.
                    </p>

                </div>

            </main>

        </section>

    </div>

</div>
