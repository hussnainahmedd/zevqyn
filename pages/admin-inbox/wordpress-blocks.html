<style data-wp-block-html="css">
/* ==========================================================================
   ZEVQYN V1.1 REFINED ADMIN INBOX STYLES
   Scope: #zev-admin-inbox / .zai-page
   Design System: docs/DESIGN_SYSTEM_V1_1.md
   ========================================================================== */

/* Hide default Blocksy page titles */
.hero-section,
.page-title,
.entry-header,
header.entry-header,
.ct-page-title,
.entry-title {
    display: none !important;
}

#zev-admin-inbox,
#zev-admin-inbox * {
    box-sizing: border-box;
}

#zev-admin-inbox {
    --zai-bg: var(--zev-bg-canvas, #090b0e);
    --zai-panel: var(--zev-bg-panel, #0f1217);
    --zai-panel-2: var(--zev-bg-surface, #151921);
    --zai-subtle: var(--zev-bg-subtle, #222834);

    --zai-border: var(--zev-border-default, rgba(255, 255, 255, 0.10));
    --zai-border-strong: var(--zev-border-strong, rgba(255, 255, 255, 0.18));
    --zai-border-faint: var(--zev-border-faint, rgba(255, 255, 255, 0.06));

    --zai-green: var(--zev-green-primary, #2ebd68);
    --zai-green-dark: var(--zev-green-hover, #269f58);
    --zai-green-text: var(--zev-green-text, #41cf7b);
    --zai-green-soft: var(--zev-green-soft, rgba(46, 189, 104, 0.08));
    --zai-green-border: var(--zev-green-border, rgba(46, 189, 104, 0.22));

    --zai-text: var(--zev-text-primary, #f4f6f8);
    --zai-text-sec: var(--zev-text-secondary, #c0c7d2);
    --zai-muted: var(--zev-text-muted, #828c9a);
    --zai-danger: #ef4444;

    min-height: 100vh;
    background: var(--zai-bg);
    color: var(--zai-text);
    padding: 48px 24px 80px;
    font-family: var(--zev-font-sans, 'Inter', -apple-system, sans-serif);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

#zev-admin-inbox button,
#zev-admin-inbox input,
#zev-admin-inbox select {
    font: inherit;
}

.zai-shell {
    width: min(1320px, 100%);
    margin: 0 auto;
}

/* =====================================
   TOP BAR
   ===================================== */

.zai-topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--zai-border);
}

.zai-eyebrow {
    color: var(--zai-green-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.zai-topbar h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.15;
    letter-spacing: -0.025em;
    font-weight: 700;
}

.zai-topbar p {
    margin: 6px 0 0;
    color: var(--zai-muted);
    font-size: 14px;
}

.zai-admin-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--zai-green-border);
    background: var(--zai-green-soft);
    border-radius: var(--zev-radius-xs, 4px);
    color: var(--zai-green-text);
    font-size: 11px;
    font-family: var(--zev-font-mono, monospace);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.zai-admin-dot {
    width: 6px;
    height: 6px;
    background: var(--zai-green);
    border-radius: 50%;
}

/* =====================================
   STATS BAR
   ===================================== */

.zai-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
}

.zai-stat-card {
    border: 1px solid var(--zai-border);
    background: var(--zai-panel);
    border-radius: var(--zev-radius-md, 10px);
    padding: 18px 20px;
    transition: border-color var(--zev-duration-standard, 200ms) ease;
}

.zai-stat-card:hover {
    border-color: var(--zai-border-strong);
}

.zai-stat-card span {
    display: block;
    color: var(--zai-muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
}

.zai-stat-card strong {
    display: block;
    font-size: 24px;
    line-height: 1.2;
    color: var(--zai-text);
    font-weight: 700;
}

/* =====================================
   TOOLBAR
   ===================================== */

.zai-toolbar {
    display: grid;
    grid-template-columns: minmax(200px, 1fr) 180px auto;
    gap: 10px;
    margin-bottom: 20px;
}

.zai-search-wrap {
    position: relative;
}

.zai-search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--zai-muted);
    pointer-events: none;
    font-size: 14px;
}

.zai-search-wrap input,
.zai-toolbar select {
    width: 100%;
    height: 40px;
    border: 1px solid var(--zai-border);
    background: var(--zai-panel);
    color: var(--zai-text);
    border-radius: var(--zev-radius-sm, 6px);
    outline: none;
    font-size: 13px;
    transition: border-color var(--zev-duration-standard, 200ms) ease;
}

.zai-search-wrap input {
    padding: 0 14px 0 38px;
}

.zai-toolbar select {
    padding: 0 12px;
    color-scheme: dark;
}

.zai-search-wrap input:focus,
.zai-toolbar select:focus {
    border-color: var(--zai-green);
    box-shadow: 0 0 0 3px rgba(46, 189, 104, 0.15);
}

.zai-refresh {
    height: 40px;
    padding: 0 16px;
    border-radius: var(--zev-radius-sm, 6px);
    border: 1px solid var(--zai-border);
    background: var(--zai-panel);
    color: var(--zai-text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background var(--zev-duration-standard, 200ms) ease;
}

.zai-refresh:hover {
    background: var(--zai-subtle);
    border-color: var(--zai-border-strong);
}

/* =====================================
   STATUS BANNER
   ===================================== */

.zai-status {
    display: none;
    padding: 12px 16px;
    border-radius: var(--zev-radius-sm, 6px);
    margin-bottom: 16px;
    font-size: 13px;
}

.zai-status.zai-show {
    display: block;
}

.zai-status.zai-info {
    border: 1px solid rgba(59, 130, 246, 0.3);
    background: rgba(59, 130, 246, 0.1);
    color: #93c5fd;
}

.zai-status.zai-error {
    border: 1px solid rgba(239, 68, 68, 0.3);
    background: rgba(239, 68, 68, 0.1);
    color: #fca5a5;
}

/* =====================================
   INBOX MASTER-DETAIL
   ===================================== */

.zai-inbox {
    min-height: 580px;
    display: grid;
    grid-template-columns: minmax(320px, 0.85fr) minmax(0, 1.45fr);
    overflow: hidden;
    border: 1px solid var(--zai-border);
    border-radius: var(--zev-radius-md, 10px);
    background: var(--zai-panel);
}

.zai-list-panel {
    min-width: 0;
    border-right: 1px solid var(--zai-border);
    display: flex;
    flex-direction: column;
}

.zai-list-heading {
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--zai-border-faint);
    font-size: 13px;
    font-weight: 700;
}

.zai-small-count {
    min-width: 24px;
    height: 22px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--zai-green-soft);
    border: 1px solid var(--zai-green-border);
    color: var(--zai-green-text);
    font-size: 11px;
    font-family: var(--zev-font-mono, monospace);
    font-weight: 700;
}

.zai-message-list {
    max-height: 620px;
    overflow-y: auto;
}

.zai-message-item {
    position: relative;
    padding: 14px 16px;
    border-bottom: 1px solid var(--zai-border-faint);
    cursor: pointer;
    transition: background var(--zev-duration-standard, 200ms) ease;
}

.zai-message-item:hover {
    background: var(--zai-panel-2);
}

.zai-message-item.zai-active {
    background: var(--zai-green-soft);
}

.zai-message-item.zai-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    background: var(--zai-green);
    border-radius: 0 3px 3px 0;
}

.zai-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
}

.zai-sender {
    font-size: 13px;
    font-weight: 600;
    color: var(--zai-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.zai-date {
    color: var(--zai-muted);
    font-size: 11px;
    white-space: nowrap;
    font-family: var(--zev-font-mono, monospace);
}

.zai-item-subject {
    color: var(--zai-text-sec);
    font-size: 12px;
    margin-bottom: 4px;
    font-weight: 500;
}

.zai-item-preview {
    color: var(--zai-muted);
    font-size: 12px;
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.zai-status-pill {
    display: inline-flex;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: var(--zev-radius-xs, 4px);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    font-family: var(--zev-font-mono, monospace);
}

.zai-pill-new {
    color: var(--zai-green-text);
    background: var(--zai-green-soft);
    border: 1px solid var(--zai-green-border);
}

.zai-pill-read {
    color: #93c5fd;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.25);
}

.zai-pill-replied {
    color: #c4b5fd;
    background: rgba(167, 139, 250, 0.1);
    border: 1px solid rgba(167, 139, 250, 0.25);
}

.zai-pill-archived {
    color: var(--zai-muted);
    background: var(--zai-subtle);
    border: 1px solid var(--zai-border);
}

/* =====================================
   DETAIL PANEL
   ===================================== */

.zai-detail {
    min-width: 0;
    padding: 28px;
}

.zai-empty {
    min-height: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.zai-empty-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--zai-green-border);
    background: var(--zai-green-soft);
    color: var(--zai-green-text);
    border-radius: var(--zev-radius-md, 10px);
    font-size: 22px;
    margin-bottom: 16px;
}

.zai-empty h2 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--zai-text);
    font-weight: 700;
}

.zai-empty p {
    max-width: 320px;
    margin: 0;
    color: var(--zai-muted);
    line-height: 1.5;
    font-size: 13px;
}

.zai-detail-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.zai-detail-label {
    color: var(--zai-green-text);
    font-size: 11px;
    letter-spacing: 0.08em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.zai-detail h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.25;
    color: var(--zai-text);
    font-weight: 700;
}

.zai-detail-date {
    color: var(--zai-muted);
    font-size: 12px;
    white-space: nowrap;
    font-family: var(--zev-font-mono, monospace);
}

.zai-person {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.zai-person-box {
    padding: 14px;
    border-radius: var(--zev-radius-sm, 6px);
    border: 1px solid var(--zai-border);
    background: var(--zai-panel-2);
}

.zai-person-box span {
    display: block;
    color: var(--zai-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    margin-bottom: 4px;
}

.zai-person-box strong,
.zai-person-box a {
    color: var(--zai-text);
    font-size: 13px;
    text-decoration: none;
    word-break: break-word;
    font-weight: 600;
}

.zai-person-box a:hover {
    color: var(--zai-green-text);
    text-decoration: underline;
}

.zai-message-body {
    padding: 20px;
    border-radius: var(--zev-radius-md, 10px);
    border: 1px solid var(--zai-border);
    background: var(--zai-panel-2);
    color: var(--zai-text);
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-bottom: 24px;
}

.zai-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.zai-actions select {
    height: 38px;
    padding: 0 12px;
    border-radius: var(--zev-radius-sm, 6px);
    border: 1px solid var(--zai-border);
    background: var(--zai-panel-2);
    color: var(--zai-text);
    color-scheme: dark;
    outline: none;
    font-size: 13px;
}

.zai-action-button {
    height: 38px;
    padding: 0 16px;
    border-radius: var(--zev-radius-sm, 6px);
    border: 1px solid var(--zai-border);
    background: var(--zai-panel-2);
    color: var(--zai-text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background var(--zev-duration-standard, 200ms) ease;
}

.zai-action-button:hover {
    background: var(--zai-subtle);
    border-color: var(--zai-border-strong);
}

.zai-reply {
    background: var(--zai-green);
    border-color: var(--zai-green);
    color: #ffffff !important;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 38px;
    padding: 0 16px;
    border-radius: var(--zev-radius-sm, 6px);
    font-size: 13px;
    transition: background var(--zev-duration-standard, 200ms) ease;
}

.zai-reply:hover {
    background: var(--zai-green-dark);
}

/* =====================================
   FEEDBACK STATES
   ===================================== */

.zai-loading {
    padding: 24px 16px;
    color: var(--zai-muted);
    font-size: 13px;
    text-align: center;
}

.zai-no-results {
    padding: 32px 16px;
    text-align: center;
    color: var(--zai-muted);
    font-size: 13px;
}

/* =====================================
   RESPONSIVE DESIGN
   ===================================== */

@media (max-width: 900px) {
    #zev-admin-inbox {
        padding: 32px 16px 60px;
    }

    .zai-stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .zai-toolbar {
        grid-template-columns: 1fr 1fr;
    }

    .zai-search-wrap {
        grid-column: 1 / -1;
    }

    .zai-inbox {
        grid-template-columns: 1fr;
    }

    .zai-list-panel {
        border-right: 0;
        border-bottom: 1px solid var(--zai-border);
    }

    .zai-message-list {
        max-height: 380px;
    }
}

@media (max-width: 560px) {
    .zai-topbar {
        flex-direction: column;
    }

    .zai-stats {
        grid-template-columns: 1fr 1fr;
    }

    .zai-toolbar {
        grid-template-columns: 1fr;
    }

    .zai-search-wrap {
        grid-column: auto;
    }

    .zai-detail {
        padding: 20px 16px;
    }

    .zai-detail-top {
        flex-direction: column;
    }

    .zai-person {
        grid-template-columns: 1fr;
    }
}

@media (prefers-reduced-motion: reduce) {
    .zai-message-item,
    .zai-refresh,
    .zai-action-button,
    .zai-reply {
        transition: none !important;
    }
}

<script data-wp-block-html="js">
﻿
function zevAdminInboxInitialize() {

    var API_BASE =
        "https://zevqyn-backend.onrender.com";

    var SUPABASE_URL =
        "https://phjizxajnigiiawitkyx.supabase.co";

    var SUPABASE_KEY =
        "sb_publishable_oYTMqlTbVsNqToWxvq6I9w_pQ9NFZWk";


    var root =
        document.getElementById(
            "zev-admin-inbox"
        );

    if (!root) {
        return;
    }


    var messageList =
        document.getElementById(
            "zai-message-list"
        );

    var detail =
        document.getElementById(
            "zai-detail"
        );

    var searchField =
        document.getElementById(
            "zai-search"
        );

    var filterField =
        document.getElementById(
            "zai-filter"
        );

    var refreshButton =
        document.getElementById(
            "zai-refresh"
        );

    var statusBox =
        document.getElementById(
            "zai-status"
        );


    var messages = [];

    var selectedId = null;

    var accessToken = null;


    /* =====================================
       HELPERS
       ===================================== */

    function zaiEscape(value) {

        var element =
            document.createElement("div");

        element.textContent =
            value === null
                ? ""
                : String(value);

        return element.innerHTML;

    }


    function zaiShowStatus(
        message,
        type
    ) {

        if (!statusBox) {
            return;
        }

        statusBox.className =
            "zai-status zai-show " +
            type;

        statusBox.textContent =
            message;

    }


    function zaiHideStatus() {

        if (!statusBox) {
            return;
        }

        statusBox.className =
            "zai-status";

        statusBox.textContent = "";

    }


    function zaiFormatDate(value) {

        if (!value) {
            return "";
        }

        var date =
            new Date(value);

        if (
            isNaN(
                date.getTime()
            )
        ) {
            return value;
        }

        return date.toLocaleString(
            undefined,
            {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            }
        );

    }


    function zaiGetStatusClass(
        status
    ) {

        if (status === "new") {
            return "zai-pill-new";
        }

        if (status === "read") {
            return "zai-pill-read";
        }

        if (status === "replied") {
            return "zai-pill-replied";
        }

        return "zai-pill-archived";

    }


    /* =====================================
       SUPABASE SESSION
       ===================================== */

  function zaiGetSession() {

    var storageKey =
        "sb-phjizxajnigiiawitkyx-auth-token";

    var storedValue =
        window.localStorage.getItem(
            storageKey
        );

    if (!storedValue) {

        zaiShowStatus(
            "Please sign in to ZEVQYN again.",
            "zai-error"
        );

        return;

    }


    var storedData = null;

    try {

        storedData =
            JSON.parse(
                storedValue
            );

    } catch (error) {

        zaiShowStatus(
            "Your ZEVQYN login session could not be read.",
            "zai-error"
        );

        return;

    }


    var token = null;


    if (storedData) {

        if (storedData.access_token) {

            token =
                storedData.access_token;

        }


        if (!token) {

            if (storedData.currentSession) {

                if (
                    storedData.currentSession.access_token
                ) {

                    token =
                        storedData.currentSession.access_token;

                }

            }

        }


        if (!token) {

            if (storedData.session) {

                if (
                    storedData.session.access_token
                ) {

                    token =
                        storedData.session.access_token;

                }

            }

        }

    }


    if (!token) {

        zaiShowStatus(
            "Your ZEVQYN session token could not be found. Please sign in again.",
            "zai-error"
        );

        return;

    }


    accessToken = token;


    zaiHideStatus();


    zaiLoadMessages();

}


    /* =====================================
       API REQUEST
       ===================================== */

    function zaiApiRequest(
        method,
        path,
        body,
        callback
    ) {

        if (!accessToken) {

            zaiShowStatus(
                "Your ZEVQYN session is unavailable.",
                "zai-error"
            );

            return;

        }


        var request =
            new XMLHttpRequest();


        request.open(
            method,
            API_BASE + path,
            true
        );


        request.setRequestHeader(
            "Authorization",
            "Bearer " + accessToken
        );


        request.setRequestHeader(
            "Content-Type",
            "application/json"
        );


        request.onreadystatechange =
            function () {

                if (
                    request.readyState !== 4
                ) {
                    return;
                }


                var data = null;


                try {

                    data =
                        JSON.parse(
                            request.responseText
                        );

                } catch (error) {

                    data = null;

                }


                callback(
                    request.status,
                    data
                );

            };


        request.onerror =
            function () {

                callback(
                    0,
                    null
                );

            };


        if (body) {

            request.send(
                JSON.stringify(body)
            );

        } else {

            request.send();

        }

    }


    /* =====================================
       LOAD MESSAGES
       ===================================== */

    function zaiLoadMessages() {

        if (messageList) {

            messageList.innerHTML =
                '<div class="zai-loading">' +
                'Loading messages...' +
                '</div>';

        }


        zaiHideStatus();


        zaiApiRequest(
            "GET",
            "/api/v1/contact/messages",
            null,
            function (
                status,
                data
            ) {

                if (status === 401) {

                    zaiShowStatus(
                        "Your session has expired. Please sign in again.",
                        "zai-error"
                    );

                    return;

                }


                if (status === 403) {

                    zaiShowStatus(
                        "Admin access is required to view this inbox.",
                        "zai-error"
                    );

                    if (messageList) {
                        messageList.innerHTML = "";
                    }

                    return;

                }


                if (status !== 200) {

                    zaiShowStatus(
                        "Unable to load contact messages.",
                        "zai-error"
                    );

                    return;

                }


                if (
                    !Array.isArray(data)
                ) {

                    zaiShowStatus(
                        "Unexpected response from the server.",
                        "zai-error"
                    );

                    return;

                }


                messages = data;


                zaiUpdateStats();

                zaiRenderList();


                if (
                    selectedId
                ) {

                    zaiRenderSelected();

                }

            }
        );

    }


    /* =====================================
       STATS
       ===================================== */

    function zaiUpdateStats() {

        var total =
            messages.length;

        var newCount = 0;

        var readCount = 0;

        var repliedCount = 0;


        messages.forEach(
            function (message) {

                if (
                    message.status ===
                    "new"
                ) {
                    newCount += 1;
                }

                if (
                    message.status ===
                    "read"
                ) {
                    readCount += 1;
                }

                if (
                    message.status ===
                    "replied"
                ) {
                    repliedCount += 1;
                }

            }
        );


        document.getElementById(
            "zai-total-count"
        ).textContent =
            String(total);


        document.getElementById(
            "zai-new-count"
        ).textContent =
            String(newCount);


        document.getElementById(
            "zai-read-count"
        ).textContent =
            String(readCount);


        document.getElementById(
            "zai-replied-count"
        ).textContent =
            String(repliedCount);

    }


    /* =====================================
       FILTER
       ===================================== */

    function zaiFilteredMessages() {

        var query = "";

        var filter = "all";


        if (searchField) {

            query =
                searchField.value
                    .trim()
                    .toLowerCase();

        }


        if (filterField) {

            filter =
                filterField.value;

        }


        return messages.filter(
            function (message) {

                if (
                    filter !== "all"
                ) {

                    if (
                        message.status !==
                        filter
                    ) {
                        return false;
                    }

                }


                if (!query) {
                    return true;
                }


                var combined =
                    String(
                        message.name || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.email || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.subject || ""
                    ).toLowerCase() +
                    " " +
                    String(
                        message.message || ""
                    ).toLowerCase();


                return (
                    combined.indexOf(
                        query
                    ) !== -1
                );

            }
        );

    }


    /* =====================================
       LIST
       ===================================== */

    function zaiRenderList() {

        if (!messageList) {
            return;
        }


        var filtered =
            zaiFilteredMessages();


        var visibleCount =
            document.getElementById(
                "zai-visible-count"
            );


        if (visibleCount) {

            visibleCount.textContent =
                String(
                    filtered.length
                );

        }


        if (
            filtered.length === 0
        ) {

            messageList.innerHTML =
                '<div class="zai-no-results">' +
                'No messages found.' +
                '</div>';

            return;

        }


        var html = "";


        filtered.forEach(
            function (message) {

                var activeClass = "";

                if (
                    selectedId ===
                    message.id
                ) {

                    activeClass =
                        " zai-active";

                }


                var preview =
                    message.message || "";


                html +=
                    '<div class="zai-message-item' +
                    activeClass +
                    '" data-message-id="' +
                    zaiEscape(
                        message.id
                    ) +
                    '">' +

                    '<div class="zai-item-top">' +

                    '<div class="zai-sender">' +
                    zaiEscape(
                        message.name
                    ) +
                    '</div>' +

                    '<div class="zai-date">' +
                    zaiEscape(
                        zaiFormatDate(
                            message.created_at
                        )
                    ) +
                    '</div>' +

                    '</div>' +

                    '<div class="zai-item-subject">' +
                    zaiEscape(
                        message.subject
                    ) +
                    '</div>' +

                    '<div class="zai-item-preview">' +
                    zaiEscape(
                        preview
                    ) +
                    '</div>' +

                    '<span class="zai-status-pill ' +
                    zaiGetStatusClass(
                        message.status
                    ) +
                    '">' +
                    zaiEscape(
                        message.status
                    ) +
                    '</span>' +

                    '</div>';

            }
        );


        messageList.innerHTML =
            html;


        var items =
            messageList.querySelectorAll(
                ".zai-message-item"
            );


        items.forEach(
            function (item) {

                item.addEventListener(
                    "click",
                    function () {

                        selectedId =
                            item.getAttribute(
                                "data-message-id"
                            );


                        zaiRenderList();

                        zaiRenderSelected();

                    }
                );

            }
        );

    }


    /* =====================================
       DETAIL
       ===================================== */

    function zaiFindSelected() {

        var selected = null;


        messages.forEach(
            function (message) {

                if (
                    message.id ===
                    selectedId
                ) {

                    selected =
                        message;

                }

            }
        );


        return selected;

    }


    function zaiRenderSelected() {

        if (!detail) {
            return;
        }


        var message =
            zaiFindSelected();


        if (!message) {

            detail.innerHTML =
                '<div class="zai-empty">' +
                '<div class="zai-empty-icon">✉</div>' +
                '<h2>Select a message</h2>' +
                '<p>Choose a contact message from the inbox to read it here.</p>' +
                '</div>';

            return;

        }


        var replyLink =
            "mailto:" +
            encodeURIComponent(
                message.email
            ) +
            "?subject=" +
            encodeURIComponent(
                "Re: " +
                message.subject +
                " — ZEVQYN"
            );


        detail.innerHTML =

            '<div class="zai-detail-top">' +

                '<div>' +

                    '<div class="zai-detail-label">' +
                    'Contact message' +
                    '</div>' +

                    '<h2>' +
                    zaiEscape(
                        message.subject
                    ) +
                    '</h2>' +

                '</div>' +

                '<div class="zai-detail-date">' +
                zaiEscape(
                    zaiFormatDate(
                        message.created_at
                    )
                ) +
                '</div>' +

            '</div>' +


            '<div class="zai-person">' +

                '<div class="zai-person-box">' +

                    '<span>From</span>' +

                    '<strong>' +
                    zaiEscape(
                        message.name
                    ) +
                    '</strong>' +

                '</div>' +


                '<div class="zai-person-box">' +

                    '<span>Email</span>' +

                    '<a href="mailto:' +
                    zaiEscape(
                        message.email
                    ) +
                    '">' +
                    zaiEscape(
                        message.email
                    ) +
                    '</a>' +

                '</div>' +

            '</div>' +


            '<div class="zai-message-body">' +
            zaiEscape(
                message.message
            ) +
            '</div>' +


            '<div class="zai-actions">' +

                '<select id="zai-status-select">' +

                    '<option value="new">' +
                    'New' +
                    '</option>' +

                    '<option value="read">' +
                    'Read' +
                    '</option>' +

                    '<option value="replied">' +
                    'Replied' +
                    '</option>' +

                    '<option value="archived">' +
                    'Archived' +
                    '</option>' +

                '</select>' +


                '<button ' +
                'id="zai-save-status" ' +
                'class="zai-action-button" ' +
                'type="button">' +
                'Update status' +
                '</button>' +


                '<a class="zai-action-button zai-reply" href="' +
                zaiEscape(
                    replyLink
                ) +
                '">' +
                'Reply by email' +
                '</a>' +

            '</div>';


        var statusSelect =
            document.getElementById(
                "zai-status-select"
            );


        if (statusSelect) {

            statusSelect.value =
                message.status;

        }


        var saveButton =
            document.getElementById(
                "zai-save-status"
            );


        if (saveButton) {

            saveButton.addEventListener(
                "click",
                function () {

                    zaiUpdateMessageStatus(
                        message.id,
                        statusSelect.value
                    );

                }
            );

        }


        if (
            message.status === "new"
        ) {

            zaiUpdateMessageStatus(
                message.id,
                "read",
                true
            );

        }

    }


    /* =====================================
       UPDATE STATUS
       ===================================== */

    function zaiUpdateMessageStatus(
        id,
        newStatus,
        silent
    ) {

        zaiApiRequest(
            "PATCH",
            "/api/v1/contact/messages/" +
            encodeURIComponent(id),
            {
                status: newStatus
            },
            function (
                status,
                data
            ) {

                if (status !== 200) {

                    if (!silent) {

                        zaiShowStatus(
                            "Unable to update message status.",
                            "zai-error"
                        );

                    }

                    return;

                }


                messages.forEach(
                    function (message) {

                        if (
                            message.id === id
                        ) {

                            message.status =
                                data.status;

                        }

                    }
                );


                zaiUpdateStats();

                zaiRenderList();

                zaiRenderSelected();


                if (!silent) {

                    zaiShowStatus(
                        "Message status updated.",
                        "zai-info"
                    );

                }

            }
        );

    }


    /* =====================================
       SEARCH + FILTER
       ===================================== */

    if (searchField) {

        searchField.addEventListener(
            "input",
            function () {

                zaiRenderList();

            }
        );

    }


    if (filterField) {

        filterField.addEventListener(
            "change",
            function () {

                zaiRenderList();

            }
        );

    }


    if (refreshButton) {

        refreshButton.addEventListener(
            "click",
            function () {

                zaiLoadMessages();

            }
        );

    }


    /* =====================================
       START
       ===================================== */

    zaiGetSession();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            zevAdminInboxInitialize();

        }
    );

} else {

    zevAdminInboxInitialize();

}

</script>

        <header class="zai-topbar">
            <div>
                <div class="zai-eyebrow">ZEVQYN ADMIN</div>
                <h1>Contact Inbox</h1>
                <p>Manage messages sent through the ZEVQYN website.</p>
            </div>

            <div class="zai-admin-badge">
                <span class="zai-admin-dot"></span>
                Admin
            </div>
        </header>


        <!-- STATS -->
        <section class="zai-stats">

            <div class="zai-stat-card">
                <span>Total</span>
                <strong id="zai-total-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>New</span>
                <strong id="zai-new-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>Read</span>
                <strong id="zai-read-count">0</strong>
            </div>

            <div class="zai-stat-card">
                <span>Replied</span>
                <strong id="zai-replied-count">0</strong>
            </div>

        </section>


        <!-- TOOLBAR -->
        <section class="zai-toolbar">

            <div class="zai-search-wrap">
                <span class="zai-search-icon">⌕</span>

                <input id="zai-search" type="text" placeholder="Search messages..." autocomplete="off">
            </div>


            <select id="zai-filter">
                <option value="all">All messages</option>
                <option value="new">New</option>
                <option value="read">Read</option>
                <option value="replied">Replied</option>
                <option value="archived">Archived</option>
            </select>


            <button id="zai-refresh" class="zai-refresh" type="button">
                ↻ Refresh
            </button>

        </section>


        <!-- STATUS -->
        <div id="zai-status" class="zai-status"></div>


        <!-- INBOX -->
        <section class="zai-inbox">

            <!-- MESSAGE LIST -->
            <aside class="zai-list-panel">

                <div class="zai-list-heading">
                    <span>Messages</span>

                    <span id="zai-visible-count" class="zai-small-count">
                        0
                    </span>
                </div>


                <div id="zai-message-list" class="zai-message-list">
                </div>

            </aside>


            <!-- MESSAGE DETAIL -->
            <main id="zai-detail" class="zai-detail">

                <div class="zai-empty">

                    <div class="zai-empty-icon">
                        ✉
                    </div>

                    <h2>Select a message</h2>

                    <p>
                        Choose a contact message from the
                        inbox to read it here.
                    </p>

                </div>

            </main>

        </section>

    </div>

</div>
