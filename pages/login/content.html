<div class="zevqyn-login-card">

    <!-- EMAIL -->
    <div class="zevqyn-field">

        <label for="zevqyn-email">
            Email address
        </label>

        <input type="email" id="zevqyn-email" name="email" placeholder="you@example.com" autocomplete="email" required="">

    </div>


    <!-- PASSWORD -->
    <div class="zevqyn-field">

        <label for="zevqyn-password">
            Password
        </label>

        <input type="password" id="zevqyn-password" name="password" placeholder="Enter your password" autocomplete="current-password" required="">

    </div>


    <!-- OPTIONS -->
    <div class="zevqyn-options">

        <label class="zevqyn-remember">

            <input type="checkbox" id="zevqyn-remember">

            Remember me

        </label>

        <a href="#">
            Forgot password?
        </a>

    </div>


    <!-- SIGN IN -->
    <button type="button" id="zevqyn-login-btn">
        Sign In
    </button>


    <!-- REGISTER -->
    <p class="zevqyn-register">

        Don't have an account?

        <a href="/register/">
            Create account
        </a>

    </p>

</div>
